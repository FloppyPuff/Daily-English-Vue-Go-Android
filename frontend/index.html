<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#22352b" />
    <meta name="description" content="Daily English：CET-6 与考研英语的日常学习空间。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Daily English</title>
    <script>
      (() => {
        const hour = new Date().getHours();
        const dark = hour >= 19 || hour < 7;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#141816' : '#22352b');
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f6f4ee; color: #1b211e; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #141816; color: #e7e9e1; }
      #app { min-height: 100vh; }
      .boot { min-height: 100vh; display: grid; place-items: center; font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #5b665f; letter-spacing: .08em; }
      html[data-theme="dark"] .boot { color: #b5bdb5; }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot">DAILY ENGLISH</div></div>
    <noscript>请启用 JavaScript 后使用 Daily English。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
